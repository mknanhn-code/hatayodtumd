<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil & Ayarlar - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* --- GENEL STİLLER --- */
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f4f6f9; --white: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); display: block; min-height: 100vh; }

    /* NAVBAR */
    .navbar { width: 100%; height: 70px; background-color: var(--odtu-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-logo { height: 50px; background: white; padding: 2px; border-radius: 5px; }
    .nav-title { color: white; font-size: 1.1rem; font-weight: bold; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: #bdc3c7; text-decoration: none; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; transition: 0.3s; position: relative; }
    .nav-links a:hover, .nav-links a.active { background-color: rgba(255,255,255,0.1); color: white; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .logout-btn { color: #e74c3c; border: 1px solid #e74c3c; padding: 6px 15px; border-radius: 20px; text-decoration: none; transition: 0.3s; }
    .logout-btn:hover { background: #e74c3c; color: white; }

    /* BİLDİRİM ROZETİ */
    .badge-count { position: absolute; top: 0px; right: -5px; background: var(--odtu-red); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; display: none; border: 1px solid white; }

    /* İÇERİK ALANI */
    .main-content { margin-top: 70px; padding: 30px; max-width: 1000px; margin-left: auto; margin-right: auto; }

    /* SEKME (TAB) YAPISI */
    .tab-header { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #ddd; padding-bottom: 0; overflow-x: auto; }
    .tab-btn { background: none; border: none; font-size: 1rem; cursor: pointer; color: #777; padding: 15px 20px; font-weight: bold; transition: 0.3s; border-bottom: 3px solid transparent; }
    .tab-btn:hover { color: var(--odtu-red); background: rgba(0,0,0,0.02); }
    .tab-btn.active { color: var(--odtu-dark); border-bottom: 3px solid var(--odtu-red); background: white; border-radius: 8px 8px 0 0; }
    
    .tab-content { display: none; animation: fadeIn 0.4s; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* 1. AYARLAR STİLİ (Senin Kodun) */
    .settings-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
    .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
    .form-group { flex: 1; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; transition: 0.3s; }
    .form-group input:focus { border-color: var(--odtu-red); }
    .form-group input[readonly] { background: #f9f9f9; cursor: not-allowed; }
    .btn-save { background-color: var(--odtu-red); color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; float: right; font-weight: bold; }

    /* 2. NOTLAR STİLİ */
    .notes-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .note-editor textarea { width: 100%; height: 150px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; resize: none; outline: none; }
    .btn-add-note { background: var(--odtu-dark); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .notes-list { max-height: 400px; overflow-y: auto; }
    .note-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #f39c12; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
    .delete-note { position: absolute; top: 10px; right: 10px; color: #e74c3c; cursor: pointer; }

    /* 3. MESAJLAR STİLİ */
    .messages-layout { display: flex; gap: 20px; height: 500px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .msg-sidebar { width: 35%; background: #f8f9fa; border-right: 1px solid #eee; padding: 15px; overflow-y: auto; }
    .msg-content { flex: 1; padding: 20px; display: flex; flex-direction: column; background: white; }
    
    .msg-item { padding: 15px; background: white; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #eee; }
    .msg-item:hover { background: #e9ecef; }
    .msg-item.unread { border-left: 4px solid var(--odtu-red); font-weight: bold; background: #fff5f5; }
    
    #chatBox { flex: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
    .chat-bubble { max-width: 75%; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; font-size: 0.9rem; position: relative; }
    .mine { background: var(--odtu-dark); color: white; margin-left: auto; border-bottom-right-radius: 2px; }
    .theirs { background: #e0e0e0; color: #333; margin-right: auto; border-bottom-left-radius: 2px; }
    
    .send-area { display: flex; gap: 10px; }
    .send-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
    .send-btn { background: var(--odtu-red); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .new-msg-btn { width: 100%; padding: 12px; background: var(--odtu-dark); color: white; border: none; border-radius: 6px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }

    /* MODAL */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
    .modal-box { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 350px; max-height: 400px; overflow-y: auto; }
    .user-row { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; }
    .user-row:hover { background: #f9f9f9; color: var(--odtu-red); }

    /* MOBİL */
    @media (max-width: 900px) {
        .navbar { height: auto; flex-direction: column; padding: 15px; }
        .nav-links { flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
        .nav-links a { flex: 1 1 auto; justify-content: center; }
        .main-content { margin-top: 0; padding: 20px; }
        
        .form-row { flex-direction: column; gap: 0; }
        .notes-container { grid-template-columns: 1fr; }
        
        .messages-layout { flex-direction: column; height: auto; }
        .msg-sidebar { width: 100%; height: 250px; border-right: none; border-bottom: 1px solid #eee; }
        .msg-content { height: 400px; }
        .btn-save { width: 100%; margin-top: 10px; }
    }
</style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="logo.jpg" class="nav-logo" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/tr/a/a6/Odt%C3%BC_logo.png';">
            <div class="nav-title">Hatay ODTÜ MD <span>Üye Portalı</span></div>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Panel</a>
            <a href="meeting.html">Etkinlik Üssü</a>
            <a href="mentor.html">Mentorluk</a>
            <a href="career.html">Kariyer</a>
            <a href="network.html">Mezun Ağı</a>
            <a href="profile.html" class="active">
                <i class="fa-solid fa-user"></i> Profil 
                <span id="navBadge" class="badge-count">0</span>
            </a>
        </div>
        <div class="nav-right">
            <a href="#" class="logout-btn" onclick="logout()">Çıkış</a>
        </div>
    </nav>

    <div class="main-content">
        
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i> Ayarlar</button>
            <button class="tab-btn" onclick="switchTab('notes')"><i class="fa-solid fa-sticky-note"></i> Notlarım</button>
            <button class="tab-btn" onclick="switchTab('messages')"><i class="fa-solid fa-envelope"></i> Mesajlar</button>
        </div>

        <div id="settings" class="tab-content active">
            <div class="settings-card">
                <h3>Kişisel Bilgiler</h3>
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group"><label>Ad Soyad</label><input type="text" id="pName" readonly></div>
                        <div class="form-group"><label>E-posta</label><input type="email" id="pEmail" readonly></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Bölüm</label><input type="text" id="pDept" placeholder="Örn: İnşaat Mühendisliği"></div>
                        <div class="form-group"><label>Mezuniyet Yılı</label><input type="number" id="pYear" placeholder="20XX"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Kurum / Şirket</label><input type="text" id="pComp"></div>
                        <div class="form-group"><label>Telefon</label><input type="text" id="pPhone"></div>
                    </div>
                    <button type="submit" id="saveBtn" class="btn-save">Değişiklikleri Kaydet</button>
                    <div style="clear:both;"></div>
                </form>
            </div>
        </div>

        <div id="notes" class="tab-content">
            <div class="notes-container">
                <div class="note-editor">
                    <h3>📝 Yeni Not</h3>
                    <textarea id="noteInput" placeholder="Aklına gelenleri buraya not al..."></textarea>
                    <button class="btn-add-note" onclick="saveNote()">Notu Kaydet</button>
                </div>
                <div class="notes-list" id="notesList">
                    <p style="text-align:center; color:#999; margin-top:20px;">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div id="messages" class="tab-content">
            <div class="messages-layout">
                <div class="msg-sidebar">
                    <button class="new-msg-btn" onclick="openUserModal()">+ Yeni Sohbet Başlat</button>
                    <div id="inboxList">Yükleniyor...</div>
                </div>
                <div class="msg-content">
                    <div id="chatBox">
                        <div style="text-align:center; color:#ccc; margin-top:50px;">
                            <i class="fa-regular fa-comments" style="font-size:3rem;"></i><br><br>
                            Sol taraftan bir konuşma seçin veya yeni mesaj gönderin.
                        </div>
                    </div>
                    <div class="send-area" style="display:none;" id="sendArea">
                        <input type="text" id="msgInput" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="userModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h3>Kime Mesaj?</h3>
                <span onclick="document.getElementById('userModal').style.display='none'" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            <div id="userList">Yükleniyor...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        let currentUser = null;
        let activeChatUserId = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if(!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            // Verileri Yükle
            loadProfile();
            loadNotes();
            loadInbox();
            checkNotifications();
        });

        // --- SEKME GEÇİŞİ ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            // Tıklanan butonu bulup active yap (Basit yol)
            const buttons = document.querySelectorAll('.tab-btn');
            if(tabId === 'settings') buttons[0].classList.add('active');
            if(tabId === 'notes') buttons[1].classList.add('active');
            if(tabId === 'messages') buttons[2].classList.add('active');
        }

        // ============================
        // 1. PROFİL AYARLARI İŞLEMLERİ
        // ============================
        async function loadProfile() {
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile) {
                document.getElementById('pName').value = profile.full_name || "";
                document.getElementById('pEmail').value = profile.email || currentUser.email;
                document.getElementById('pDept').value = profile.department || "";
                document.getElementById('pYear').value = profile.grad_year || "";
                document.getElementById('pComp').value = profile.company || "";
                document.getElementById('pPhone').value = profile.phone || "";
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Kaydediliyor...";
            
            const updates = {
                id: currentUser.id,
                department: document.getElementById('pDept').value,
                grad_year: document.getElementById('pYear').value,
                company: document.getElementById('pComp').value,
                phone: document.getElementById('pPhone').value,
                updated_at: new Date()
            };
            
            const { error } = await supabase.from('profiles').upsert(updates);
            if(error) alert("Hata: " + error.message);
            else alert("Profil başarıyla güncellendi! ✅");
            
            btn.innerText = "Değişiklikleri Kaydet";
        });

        // ============================
        // 2. NOTLAR İŞLEMLERİ
        // ============================
        async function saveNote() {
            const content = document.getElementById('noteInput').value;
            if(!content) return;
            await supabase.from('personal_notes').insert({ user_id: currentUser.id, content: content });
            document.getElementById('noteInput').value = "";
            loadNotes();
        }

        async function loadNotes() {
            const { data } = await supabase.from('personal_notes').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            const list = document.getElementById('notesList');
            if(!data || data.length === 0) { list.innerHTML = '<p style="text-align:center; color:#ccc;">Henüz notun yok.</p>'; return; }
            
            list.innerHTML = "";
            data.forEach(note => {
                list.innerHTML += `
                <div class="note-card">
                    ${note.content}
                    <i class="fa-solid fa-trash delete-note" onclick="deleteNote(${note.id})"></i>
                    <div style="font-size:0.7rem; color:#999; margin-top:10px;">${new Date(note.created_at).toLocaleDateString()}</div>
                </div>`;
            });
        }

        async function deleteNote(id) {
            if(confirm("Silmek istiyor musunuz?")) {
                await supabase.from('personal_notes').delete().eq('id', id);
                loadNotes();
            }
        }

        // ============================
        // 3. MESAJLAŞMA İŞLEMLERİ
        // ============================
        async function loadInbox() {
            const { data } = await supabase.from('direct_messages')
                .select('sender_id, sender_name, content, created_at, is_read')
                .eq('receiver_id', currentUser.id)
                .order('created_at', {ascending: false});

            const inboxList = document.getElementById('inboxList');
            const uniqueSenders = new Set();
            inboxList.innerHTML = "";

            if(!data || data.length === 0) inboxList.innerHTML = '<p style="text-align:center; color:#ccc; margin-top:20px;">Gelen kutusu boş.</p>';

            if(data) {
                data.forEach(msg => {
                    if(!uniqueSenders.has(msg.sender_id)) {
                        uniqueSenders.add(msg.sender_id);
                        const isUnread = !msg.is_read ? 'unread' : '';
                        const date = new Date(msg.created_at).toLocaleDateString();
                        inboxList.innerHTML += `
                        <div class="msg-item ${isUnread}" onclick="openChat('${msg.sender_id}', '${msg.sender_name}')">
                            <div style="font-weight:bold; display:flex; justify-content:space-between;">
                                ${msg.sender_name || 'Gizli'} <span style="font-weight:normal; font-size:0.7rem; color:#999;">${date}</span>
                            </div>
                            <div style="font-size:0.8rem; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${msg.content}</div>
                        </div>`;
                    }
                });
            }
        }

        async function openUserModal() {
            document.getElementById('userModal').style.display = 'flex';
            const { data } = await supabase.from('profiles').select('id, full_name').neq('id', currentUser.id).limit(50); // Kendini getirme
            const list = document.getElementById('userList');
            list.innerHTML = "";
            data.forEach(u => {
                list.innerHTML += `<div class="user-row" onclick="startNewChat('${u.id}', '${u.full_name}')"><span>${u.full_name}</span> <i class="fa-solid fa-paper-plane" style="color:#ddd;"></i></div>`;
            });
        }

        function startNewChat(id, name) {
            document.getElementById('userModal').style.display = 'none';
            openChat(id, name);
        }

        async function openChat(partnerId, partnerName) {
            activeChatUserId = partnerId;
            document.getElementById('sendArea').style.display = 'flex';
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = `<div style="text-align:center; padding:10px; font-weight:bold; color:var(--odtu-dark); border-bottom:1px solid #eee; margin-bottom:10px;">${partnerName}</div>`;

            // Mesajları Getir (Gelen ve Giden)
            const { data } = await supabase.from('direct_messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', {ascending: true});

            if(data) {
                data.forEach(msg => {
                    const type = msg.sender_id === currentUser.id ? 'mine' : 'theirs';
                    chatBox.innerHTML += `<div class="chat-bubble ${type}">${msg.content}</div>`;
                });
            }
            chatBox.scrollTop = chatBox.scrollHeight;

            // Okundu Yap
            await supabase.from('direct_messages').update({is_read: true}).eq('sender_id', partnerId).eq('receiver_id', currentUser.id);
            checkNotifications();
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value;
            if(!text || !activeChatUserId) return;

            const myName = currentUser.user_metadata.full_name || "Üye";

            const { error } = await supabase.from('direct_messages').insert({
                sender_id: currentUser.id, receiver_id: activeChatUserId, content: text, sender_name: myName
            });

            if(!error) {
                document.getElementById('chatBox').innerHTML += `<div class="chat-bubble mine">${text}</div>`;
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                input.value = "";
            }
        }

        // --- BİLDİRİM KONTROLÜ ---
        async function checkNotifications() {
            const { count } = await supabase.from('direct_messages')
                .select('*', { count: 'exact', head: true })
                .eq('receiver_id', currentUser.id)
                .eq('is_read', false);
            
            const badge = document.getElementById('navBadge');
            if(count > 0) { badge.style.display = 'inline-block'; badge.innerText = count; } 
            else { badge.style.display = 'none'; }
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>

</body>
</html>
