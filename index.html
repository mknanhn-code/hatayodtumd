<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* REGISTER İLE AYNI TASARIM DİLİ */
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f4f6f9; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .login-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    
    .logo-area img { height: 120px; margin-bottom: 20px; }
    .logo-area h2 { color: var(--odtu-dark); margin-bottom: 10px; }
    .logo-area p { color: #777; font-size: 0.9rem; margin-bottom: 30px; }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: 0.3s; font-size: 1rem; }
    .form-control:focus { border-color: var(--odtu-red); box-shadow: 0 0 5px rgba(227, 30, 36, 0.2); }

    .btn-submit { width: 100%; padding: 14px; background: var(--odtu-red); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
    .btn-submit:hover { background: #c0392b; transform: translateY(-2px); }

    .register-link { margin-top: 25px; font-size: 0.9rem; color: #666; border-top: 1px solid #eee; padding-top: 20px; }
    .register-link a { color: var(--odtu-red); text-decoration: none; font-weight: bold; }
    .register-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <img src="logo.png" onerror="this.src='https://upload.wikimedia.org/wikipedia/tr/a/a6/Odt%C3%BC_logo.png'">
            <h2>Hoş Geldiniz</h2>
            <p>Hatay ODTÜ Mezunları Derneği ve Öğrenci Topluluğu Portalı</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> E-posta Adresi</label>
                <input type="email" id="email" class="form-control" placeholder="ornek@metu.edu.tr" required>
            </div>
            
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Şifre</label>
                <input type="password" id="password" class="form-control" placeholder="******" required>
            </div>

            <button type="submit" id="loginBtn" class="btn-submit">Giriş Yap</button>
        </form>

        <div class="register-link">
            Henüz hesabın yok mu? <br>
            <a href="register.html">Hemen Kayıt Ol</a> </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = "Giriş Yapılıyor..."; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert("Hata: E-posta veya şifre yanlış.");
                btn.innerText = originalText; btn.disabled = false;
            } else {
                // Giriş başarılı, dashboard'a yönlendir
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
