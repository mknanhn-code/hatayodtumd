<script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        let currentUser = null;
        let myApplications = new Set();

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;
            
            initMap();
            checkUserType();
            await loadMyApps();
            loadJobs();
        });

        // HARİTA
        function initMap() {
            var map = L.map('alumniMap').setView([39, 35], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            const pts = [{lat:39.89,lng:32.78,t:"Ankara"}, {lat:41.00,lng:28.97,t:"İstanbul"}, {lat:52.52,lng:13.40,t:"Berlin"}, {lat:37.77,lng:-122.41,t:"San Francisco"}];
            pts.forEach(p => L.marker([p.lat,p.lng]).addTo(map).bindPopup(p.t));
        }

        // İŞ İLANLARI MANTIĞI
        async function checkUserType() {
            const { data } = await supabase.from('profiles').select('user_type').eq('id', currentUser.id).single();
            if (data && data.user_type !== 'student') document.getElementById('addJobBtn').style.display = 'block';
        }
        async function loadMyApps() {
            const { data } = await supabase.from('job_applications').select('job_id').eq('applicant_id', currentUser.id);
            if(data) data.forEach(a => myApplications.add(a.job_id));
        }
        async function loadJobs() {
            const list = document.getElementById('jobList');
            const { data } = await supabase.from('jobs').select('*').order('created_at', { ascending: false });
            if(!data || data.length === 0) { list.innerHTML = '<div style="padding:20px; text-align:center;">İlan yok.</div>'; return; }
            list.innerHTML = '';
            data.forEach(job => {
                const isOwner = job.posted_by === currentUser.id;
                let btn = '';
                if(isOwner) btn = `<button class="btn-manage" onclick="viewApplicants(${job.id})">Başvuruları Gör</button>`;
                else if(myApplications.has(job.id)) btn = `<button class="btn-applied">Başvuruldu</button>`;
                else btn = `<button class="btn-apply" onclick="applyJob(${job.id}, this)">Başvur</button>`;
                
                list.innerHTML += `<div class="job-row"><div class="job-main"><div class="company-logo">${job.company.substring(0,2)}</div><div class="job-details"><h4>${job.title} ${isOwner?'(Siz)':''}</h4><div class="job-meta"><span>${job.company}</span><span>${job.location}</span></div></div></div><div style="text-align:right;"><span class="job-type">${job.type}</span><br><br>${btn}</div></div>`;
            });
        }
        async function postJob() {
            const t = document.getElementById('jTitle').value; const c = document.getElementById('jComp').value;
            const l = document.getElementById('jLoc').value; const type = document.getElementById('jType').value;
            const { error } = await supabase.from('jobs').insert({ title: t, company: c, location: l, type: type, posted_by: currentUser.id });
            if(!error) { closeModal('jobModal'); loadJobs(); showToast("İlan Yayında!"); }
        }
        async function applyJob(jobId, btn) {
            if(!confirm("Başvurulsun mu?")) return;
            const { error } = await supabase.from('job_applications').insert({ job_id: jobId, applicant_id: currentUser.id });
            if(!error) { btn.className = 'btn-applied'; btn.innerText='Başvuruldu'; myApplications.add(jobId); showToast("Başvuruldu!"); }
        }
        async function viewApplicants(jobId) {
            openModal('applicantsModal');
            document.getElementById('applicantsList').innerHTML = 'Yükleniyor...';
            const { data } = await supabase.from('job_applications').select(`applied_at, profiles!applicant_id(full_name, department)`).eq('job_id', jobId);
            let html = '';
            if(data) data.forEach(a => html += `<div class="applicant-row"><div><b>${a.profiles.full_name}</b><br><small>${a.profiles.department}</small></div><small>${new Date(a.applied_at).toLocaleDateString()}</small></div>`);
            document.getElementById('applicantsList').innerHTML = html || 'Başvuru yok.';
        }

        // --- LAB MODÜLLERİ (DÜZELTİLDİ: student_id -> user_id) ---
        
        // 1. CV (Tablo adı: cv_reviews)
        async function submitCV() { 
            handleLab('cv_reviews', { 
                user_id: currentUser.id, // DÜZELTİLDİ
                cv_url: document.getElementById('cvLink').value, 
                note: document.getElementById('cvNote').value 
            }, 'cvModal'); 
        }
        
        // 2. Mülakat (Tablo adı: mock_interviews)
        async function submitInt() { 
            handleLab('mock_interviews', { 
                user_id: currentUser.id, // DÜZELTİLDİ
                interview_type: document.getElementById('intType').value, 
                requested_date: document.getElementById('intDate').value 
            }, 'intModal'); 
        }
        
        // 3. Gölgeleme (Tablo adı: job_shadowing)
        async function submitSha() { 
            handleLab('job_shadowing', { 
                user_id: currentUser.id, // DÜZELTİLDİ
                sector: document.getElementById('shaSec').value, 
                motivation: document.getElementById('shaMot').value 
            }, 'shadowModal'); 
        }
        
        // 4. Akademik (Tablo adı: academic_matches)
        async function submitAca() { 
            handleLab('academic_matches', { 
                user_id: currentUser.id, // DÜZELTİLDİ
                research_topic: document.getElementById('acaTopic').value, 
                target_degree: document.getElementById('acaDeg').value 
            }, 'acaModal'); 
        }
        
        // 5. Vaka (Tablo adı: case_submissions)
        async function submitCas() { 
            handleLab('case_submissions', { 
                user_id: currentUser.id, // DÜZELTİLDİ
                case_topic: document.getElementById('casTopic').value, 
                solution_url: document.getElementById('casLink').value 
            }, 'casModal'); 
        }

        async function handleLab(table, data, modalId) {
            const { error } = await supabase.from(table).insert(data);
            if(error) alert("Hata: " + error.message);
            else { closeModal(modalId); showToast("Talep Alındı!"); }
        }

        function openModal(id) { document.getElementById(id).style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        window.onclick = function(e) { if(e.target.className==='modal-overlay') e.target.style.display='none'; }
        function showToast(msg) { const t = document.getElementById('liveToast'); document.getElementById('toastMessage').innerText = msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); }
        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>
