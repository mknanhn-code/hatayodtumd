<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Dijital Salon - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* ORTAK STİLLER */
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f4f6f9; --white: #ffffff; --meet-green: #00796b; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); display: block; min-height: 100vh; }

    /* NAVBAR */
    .navbar { width: 100%; height: 70px; background-color: var(--odtu-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-logo { height: 50px; background: white; padding: 2px; border-radius: 5px; }
    .nav-title { color: white; font-size: 1.1rem; font-weight: bold; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: #bdc3c7; text-decoration: none; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { background-color: rgba(255,255,255,0.1); color: white; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .logout-btn { color: #e74c3c; border: 1px solid #e74c3c; padding: 6px 15px; border-radius: 20px; text-decoration: none; transition: 0.3s; }
    .logout-btn:hover { background: #e74c3c; color: white; }

    /* İÇERİK */
    .main-content { margin-top: 70px; padding: 40px; width: 100%; max-width: 1200px; margin-left: auto; margin-right: auto; }
    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .create-btn { background: var(--odtu-red); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
    .create-btn:hover { background: #c0151a; }

    /* ODA KARTLARI */
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    
    .room-card { 
        background: white; border-radius: 15px; padding: 25px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; 
        border-top: 5px solid var(--meet-green); display: flex; flex-direction: column; transition: 0.3s;
    }
    .room-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    
    .room-status { 
        position: absolute; top: 15px; right: 15px; 
        background: #e0f2f1; color: var(--meet-green); 
        padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; 
        display: flex; align-items: center; gap: 5px;
    }
    
    .pulsing-dot { width: 8px; height: 8px; background-color: var(--meet-green); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .room-title { font-size: 1.2rem; font-weight: bold; color: #333; margin-bottom: 5px; }
    .room-topic { color: #666; font-size: 0.9rem; margin-bottom: 20px; flex: 1; }
    .room-host { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.85rem; color: #555; }
    .host-avatar { width: 30px; height: 30px; background: #eee; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #777; }

    .join-btn { 
        width: 100%; padding: 10px; background: var(--meet-green); color: white; 
        border: none; border-radius: 8px; cursor: pointer; font-weight: bold; 
        text-decoration: none; display: block; text-align: center; transition: 0.3s;
    }
    .join-btn:hover { background: #004d40; }
    
    .delete-btn {
        background: transparent; color: #999; border: none; cursor: pointer; 
        font-size: 0.8rem; margin-top: 10px; width: 100%; text-decoration: underline;
    }
    .delete-btn:hover { color: var(--odtu-red); }

    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: none; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; animation: slideDown 0.3s; }
    @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; }

    /* --- GELİŞMİŞ MOBİL UYUMLULUK --- */
    @media (max-width: 900px) {
        /* Menü Düzeni */
        .navbar { height: auto; flex-direction: column; padding: 15px; position: relative; }
        .nav-links { flex-wrap: wrap; justify-content: center; width: 100%; gap: 10px; }
        
        /* Menü Linklerini Butonlaştır */
        .nav-links a { 
            background-color: rgba(255,255,255,0.05); 
            padding: 10px 15px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            flex: 1 1 auto; /* Eşit dağılsın */
            justify-content: center; 
        }
        
        .main-content { margin-top: 0; padding: 20px; }
        
        /* Başlık Alanı */
        .header-area { flex-direction: column; gap: 20px; text-align: center; }
        .create-btn { width: 100%; justify-content: center; padding: 15px; font-size: 1rem; }
        
        /* Kartlar */
        .rooms-grid { grid-template-columns: 1fr; } /* Tek sütun */
        
        /* Modal (Telefonda tam ekran hissi) */
        .modal-content { width: 95%; padding: 20px; }
    }
</style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="logo.png" class="nav-logo" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/tr/a/a6/Odt%C3%BC_logo.png';">
            <div class="nav-title">Hatay ODTÜ MD <span>Üye Portalı</span></div>
        </div>
        <div class="nav-links">
            <a href="dashboard.html"><i class="fa-solid fa-layer-group"></i> Panel</a>
            <a href="meeting.html" class="active"><i class="fa-solid fa-video"></i> Meeting Hub</a>
            <a href="mentor.html"><i class="fa-solid fa-handshake-angle"></i> Mentorluk</a>
            <a href="career.html"><i class="fa-solid fa-briefcase"></i> Kariyer</a>
            <a href="network.html"><i class="fa-solid fa-users-viewfinder"></i> Mezun Ağı</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Ayarlar</a>
        </div>
        <div class="nav-right">
            <a href="#" class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="header-area">
            <div>
                <h2>🎥 Meeting Hub</h2>
                <p style="color:#666;">Profesyonel ağını genişlet, çalışma grupları kur ve canlı görüşmelere katıl.</p>
            </div>
            <button class="create-btn" onclick="document.getElementById('roomModal').style.display='flex'">
                <i class="fa-solid fa-plus"></i> Oda Oluştur
            </button>
        </div>

        <div class="rooms-grid" id="roomsList">
            <div style="text-align:center; width:100%; padding:40px; color:#999; grid-column: 1/-1;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Odalar yükleniyor...
            </div>
        </div>
    </div>

    <div id="roomModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3>Yeni Oda Aç</h3>
                <span onclick="document.getElementById('roomModal').style.display='none'" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            <div class="form-group">
                <label>Oda Başlığı</label>
                <input type="text" id="rName" class="form-control" placeholder="Örn: Java Çalışma Grubu">
            </div>
            <div class="form-group">
                <label>Konu / Açıklama</label>
                <input type="text" id="rTopic" class="form-control" placeholder="Örn: Spring Boot üzerine sohbet.">
            </div>
            <div class="form-group">
                <label>Toplantı Linki (Google Meet / Zoom)</label>
                <input type="url" id="rLink" class="form-control" placeholder="https://meet.google.com/..." required>
                <small style="color:#e74c3c; font-size:0.8rem;">* Geçerli bir link giriniz.</small>
            </div>
            <button onclick="createRoom()" style="width:100%; padding:12px; background:var(--odtu-dark); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Odayı Başlat</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if(!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            currentUser = session.user;
            
            if(!currentUser.user_metadata.full_name) {
                const { data } = await supabase.from('profiles').select('full_name').eq('id', currentUser.id).single();
                currentUser.user_metadata.full_name = data?.full_name || "Üye";
            }

            loadRooms();
        });

        async function loadRooms() {
            const list = document.getElementById('roomsList');
            const { data, error } = await supabase.from('virtual_rooms').select('*').order('created_at', { ascending: false });

            if (error) { console.error(error); return; }

            if (!data || data.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:40px; color:#777; grid-column: 1/-1;">Şu an aktif bir buluşma odası yok. İlkini sen aç!</div>';
                return;
            }

            list.innerHTML = '';
            data.forEach(room => {
                const isMyRoom = (room.created_by === currentUser.id);
                const deleteBtn = isMyRoom ? `<button class="delete-btn" onclick="deleteRoom(${room.id})">Odayı Kapat (Sil)</button>` : '';
                const avatarInitials = room.creator_name ? room.creator_name.substring(0,2).toUpperCase() : 'ME';

                const html = `
                <div class="room-card">
                    <div class="room-status"><div class="pulsing-dot"></div> Canlı</div>
                    <div class="room-title">${room.room_name}</div>
                    <div class="room-topic">${room.topic || 'Konu belirtilmedi.'}</div>
                    
                    <div class="room-host">
                        <div class="host-avatar">${avatarInitials}</div>
                        <div>Moderatör: <strong>${room.creator_name || 'Gizli Üye'}</strong></div>
                    </div>

                    <a href="${room.meet_link}" target="_blank" class="join-btn">
                        <i class="fa-solid fa-video"></i> Katıl
                    </a>
                    ${deleteBtn}
                </div>`;
                list.insertAdjacentHTML('beforeend', html);
            });
        }

        async function createRoom() {
            const name = document.getElementById('rName').value;
            const topic = document.getElementById('rTopic').value;
            const link = document.getElementById('rLink').value;

            if (!name || !link) { alert("Oda adı ve Link zorunludur!"); return; }
            
            const { error } = await supabase.from('virtual_rooms').insert({
                room_name: name,
                topic: topic,
                meet_link: link,
                created_by: currentUser.id,
                creator_name: currentUser.user_metadata.full_name
            });

            if (error) {
                alert("Hata: " + error.message);
            } else {
                alert("Oda oluşturuldu! 🎉");
                document.getElementById('roomModal').style.display = 'none';
                document.getElementById('rName').value = "";
                document.getElementById('rLink').value = "";
                loadRooms();
            }
        }

        async function deleteRoom(id) {
            if(!confirm("Bu odayı kapatmak istediğinize emin misiniz?")) return;
            const { error } = await supabase.from('virtual_rooms').delete().eq('id', id);
            if(error) alert("Silinemedi: " + error.message);
            else loadRooms();
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>

</body>
</html>
