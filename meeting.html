<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etkinlik Üssü - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* GENEL STİL */
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f4f6f9; --meet-green: #00796b; --white: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); min-height: 100vh; }

    /* --- STANDART NAVBAR --- */
    .navbar { 
        width: 100%; height: 70px; background-color: var(--odtu-dark); 
        display: flex; align-items: center; justify-content: space-between; 
        padding: 0 20px; position: fixed; top: 0; z-index: 5000; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }
    
    /* Sol Grup */
    .nav-container-left { display: flex; align-items: center; gap: 40px; }
    
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-logo { height: 40px; background: white; padding: 2px; border-radius: 6px; }
    .nav-title { color: white; font-weight: 700; font-size: 1.2rem; letter-spacing: 0.5px; white-space: nowrap; }
    
    .nav-links { display: flex; gap: 15px; align-items: center; }
    .nav-links a { 
        color: #d1d5db; text-decoration: none; font-size: 0.95rem; 
        transition: all 0.3s; padding: 8px 12px; border-radius: 6px; 
    }
    .nav-links a:hover, .nav-links a.active { color: white; background: rgba(255,255,255,0.1); }
    
    .nav-right { display: flex; align-items: center; }
    .logout-btn { 
        color: #ef4444; border: 1px solid #ef4444; padding: 6px 18px; 
        border-radius: 20px; text-decoration: none; font-size: 0.9rem; 
        transition: 0.3s; background: transparent; cursor: pointer; 
    }
    .logout-btn:hover { background: #ef4444; color: white; }
    
    .hamburger { display: none; color: white; font-size: 1.5rem; cursor: pointer; }
    .mobile-logout { display: none; }

    /* --- İÇERİK --- */
    .main-content { margin-top: 100px; padding: 30px; max-width: 1200px; margin-left: auto; margin-right: auto; }
    
    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .header-area h2 { margin: 0; color: var(--odtu-dark); font-size: 2rem; }
    .header-area p { margin: 5px 0 0 0; color: #666; font-size: 1.1rem; }
    
    .create-btn { 
        background: var(--odtu-red); color: white; border: none; 
        padding: 12px 25px; border-radius: 8px; cursor: pointer; 
        font-weight: 600; font-size: 1rem; transition: 0.3s; 
        display: flex; align-items: center; gap: 8px;
    }
    .create-btn:hover { background: #c01b20; transform: translateY(-2px); }

    /* DUYURU KARTI (YENİ) */
    .announcement-bar {
        background: #fff3cd; border-left: 5px solid #ffc107; 
        padding: 15px; margin-bottom: 30px; border-radius: 8px; 
        display: flex; align-items: center; gap: 15px;
    }
    .announcement-icon { font-size: 1.5rem; color: #ffc107; }
    .announcement-content ul { list-style: none; padding: 0; margin: 0; }
    .announcement-content li { margin-bottom: 5px; font-weight: 500; color: #856404; }
    .announcement-content li:last-child { margin-bottom: 0; }

    /* KARTLAR */
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
    .room-card { 
        background: white; border-radius: 15px; padding: 25px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; 
        border-top: 5px solid var(--meet-green); display: flex; 
        flex-direction: column; transition: 0.3s; 
    }
    .room-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .room-card.private { border-top-color: #f39c12; } 
    
    .room-status { position: absolute; top: 15px; right: 15px; padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .public-badge { background: #e0f2f1; color: var(--meet-green); } 
    .private-badge { background: #fff3e0; color: #e67e22; }
    
    .room-title { font-size: 1.3rem; font-weight: bold; color: #333; margin-bottom: 5px; }
    .room-topic { color: #666; font-size: 0.95rem; margin-bottom: 20px; flex: 1; }
    
    .room-host { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.9rem; color: #555; }
    .host-avatar { width: 35px; height: 35px; background: #eee; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #777; }
    
    .join-btn { 
        width: 100%; padding: 12px; background: var(--meet-green); 
        color: white; border: none; border-radius: 8px; cursor: pointer; 
        font-weight: 600; text-decoration: none; display: flex; 
        justify-content: center; align-items: center; gap: 8px; transition: 0.3s; 
    }
    .join-btn:hover { background: #00695c; }
    
    .delete-btn { 
        background: transparent; color: #e74c3c; border: 1px solid #e74c3c; 
        border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-top: 10px; 
        width: 100%; padding: 8px; font-weight: 600; transition: 0.3s;
    }
    .delete-btn:hover { background: #e74c3c; color: white; }

    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: none; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; }
    
    .form-group { margin-bottom: 15px; } 
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    
    .user-select-area { border: 1px solid #ddd; padding: 10px; border-radius: 8px; background: #fafafa; margin-top: 5px; }
    .selected-users { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .user-chip { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 15px; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
    .user-list { max-height: 150px; overflow-y: auto; border-top: 1px solid #eee; margin-top: 5px; }
    .user-option { padding: 8px; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #f5f5f5; font-size: 0.9rem; }
    .user-option:hover { background: #f0f9ff; }

    /* MOBİL */
    @media (max-width: 900px) {
        .navbar { justify-content: space-between; }
        .nav-container-left { width: auto; }
        .nav-links { display: none; position: absolute; top: 70px; left: 0; width: 100%; background: var(--odtu-dark); flex-direction: column; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .nav-links.active { display: flex; }
        .hamburger { display: block; }
        .nav-right { display: none; }
        .mobile-logout { display: block !important; margin-top: 15px; border: 1px solid #ef4444; color: #ef4444 !important; width: 100%; text-align: center; border-radius: 8px; padding: 10px; }
        
        .header-area { flex-direction: column; gap: 15px; text-align: center; }
        .container { margin-top: 90px; }
    }
    
    .mobile-logout { display: none; }
</style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container-left">
            <div class="nav-left">
                <img src="logo.png" class="nav-logo">
                <span class="nav-title">Hatay ODTÜ MD</span>
            </div>
            
            <div class="nav-links" id="navLinks">
                <a href="dashboard.html">Panel</a>
                <a href="meeting.html" class="active">Meeting Hub</a>
                <a href="network.html">Ağ & Mentorluk</a>
                <a href="career.html">Kariyer Lab</a>
                <a href="profile.html">Profilim <span id="globalBadge" style="display:none;"></span></a>
                <a href="admin.html" id="adminBtn" style="display:none; color:#ff6b6b; font-weight:bold;">Yönetim</a>
                <a href="#" onclick="logout()" class="mobile-logout">Çıkış Yap</a>
            </div>
        </div>

        <div class="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
        
        <div class="nav-right">
            <button class="logout-btn" onclick="logout()">Çıkış</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="header-area">
            <div>
                <h2>🎥 Etkinlik Üssü</h2>
                <p>Genel odalara katılın veya özel çalışma grupları oluşturun.</p>
            </div>
            <button class="create-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Oda Oluştur</button>
        </div>

        <div id="announcementArea" class="announcement-bar" style="display:none;">
            <div class="announcement-icon"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="announcement-content">
                <strong><i class="fa-solid fa-calendar-check"></i> Yaklaşan Etkinlikler:</strong>
                <ul id="eventList"></ul>
            </div>
        </div>

        <div class="rooms-grid" id="roomsList">
            <div style="text-align:center; width:100%; padding:40px; color:#999; grid-column: 1/-1;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Yükleniyor...
            </div>
        </div>
    </div>

    <div id="roomModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('roomModal')" style="float:right; cursor:pointer; font-size:1.5rem;">&times;</span>
            <h3 style="margin-top:0;">Yeni Oda Aç</h3>
            <div class="form-group"><label>Oda Başlığı</label><input type="text" id="rName" class="form-control" placeholder="Örn: Proje Toplantısı"></div>
            <div class="form-group"><label>Konu</label><input type="text" id="rTopic" class="form-control" placeholder="Açıklama..."></div>
            <div class="form-group">
                <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                    <input type="checkbox" id="isPublic" checked onchange="toggleUserSelect()">
                    <span>Bu oda herkese açık olsun</span>
                </label>
            </div>
            <div class="form-group" id="userSelectGroup" style="display:none;">
                <label>Katılımcıları Seç</label>
                <div class="user-select-area">
                    <div id="selectedContainer" class="selected-users"></div>
                    <input type="text" class="form-control" placeholder="İsim ara..." onkeyup="filterUsers(this.value)">
                    <div id="userListContainer" class="user-list">Yükleniyor...</div>
                </div>
            </div>
            <div class="form-group">
                <label>Toplantı Linki</label>
                <div style="display:flex; gap:10px;">
                    <input type="url" id="rLink" class="form-control" placeholder="Link...">
                    <button type="button" onclick="generateLink()" style="background:#3498db; color:white; border:none; padding:0 15px; border-radius:6px; cursor:pointer;">Üret</button>
                </div>
            </div>
            <button onclick="createRoom()" style="width:100%; padding:12px; background:var(--odtu-dark); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Odayı Başlat</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        
        let currentUser = null, allUsers = [], selectedUserIds = [];

        document.addEventListener("DOMContentLoaded", async () => {
            if(!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data } = await supabase.from('profiles').select('full_name, roles').eq('id', session.user.id).single();
            currentUser = session.user;
            currentUser.user_metadata.full_name = data?.full_name || "Üye";
            currentUser.isAdmin = data?.roles && data.roles.includes('admin');
            
            if(currentUser.isAdmin) document.getElementById('adminBtn').style.display='block';

            loadRooms(); 
            fetchAllUsers();
            fetchEvents(); // Yeni etkinlikleri çek
        });

        function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }

        // --- ETKİNLİK DUYURULARI ---
        async function fetchEvents() {
            const today = new Date().toISOString().split('T')[0];
            const { data } = await supabase.from('events').select('*').gte('event_date', today).order('event_date', { ascending: true }).limit(3);
            
            if (data && data.length > 0) {
                const list = document.getElementById('eventList');
                list.innerHTML = '';
                data.forEach(e => {
                    list.innerHTML += `<li>${new Date(e.event_date).toLocaleDateString()} - ${e.title} (${e.location || 'Online'})</li>`;
                });
                document.getElementById('announcementArea').style.display = 'flex';
            }
        }

        async function loadRooms() {
            const list = document.getElementById('roomsList');
            const { data, error } = await supabase.from('virtual_rooms').select('*').order('created_at', { ascending: false });
            if (error || !data || data.length === 0) { list.innerHTML = '<div style="text-align:center; padding:40px; color:#777; grid-column: 1/-1;">Aktif oda yok.</div>'; return; }
            list.innerHTML = ''; let visibleRooms = 0;
            data.forEach(room => {
                const isCreator = room.created_by === currentUser.id;
                const isAllowed = room.allowed_users && room.allowed_users.includes(currentUser.id);
                if (room.is_public || isCreator || currentUser.isAdmin || isAllowed) {
                    visibleRooms++;
                    const isPrivate = !room.is_public;
                    const badgeClass = isPrivate ? 'private-badge' : 'public-badge';
                    const badgeText = isPrivate ? '<i class="fa-solid fa-lock"></i> Özel' : '<i class="fa-solid fa-globe"></i> Genel';
                    const cardClass = isPrivate ? 'room-card private' : 'room-card';
                    const deleteBtn = (isCreator || currentUser.isAdmin) ? `<button class="delete-btn" onclick="deleteRoom(${room.id})">Kapat</button>` : '';
                    const avatar = room.creator_name ? room.creator_name.substring(0,2).toUpperCase() : 'ME';
                    list.insertAdjacentHTML('beforeend', `<div class="${cardClass}"><div class="room-status ${badgeClass}">${badgeText}</div><div class="room-title">${room.room_name}</div><div class="room-topic">${room.topic || ''}</div><div class="room-host"><div class="host-avatar">${avatar}</div><div>Moderatör: <strong>${room.creator_name}</strong></div></div><a href="${room.meet_link}" target="_blank" class="join-btn"><i class="fa-solid fa-video"></i> Katıl</a>${deleteBtn}</div>`);
                }
            });
            if (visibleRooms === 0) list.innerHTML = '<div style="text-align:center; padding:40px; color:#777; grid-column: 1/-1;">Size uygun oda bulunamadı.</div>';
        }

        async function createRoom() {
            const name = document.getElementById('rName').value; const topic = document.getElementById('rTopic').value; const link = document.getElementById('rLink').value; const isPublic = document.getElementById('isPublic').checked;
            if (!name || !link) { alert("Başlık ve Link zorunludur!"); return; }
            const allowed = isPublic ? [] : selectedUserIds;
            if(!isPublic && !allowed.includes(currentUser.id)) allowed.push(currentUser.id);
            const { error } = await supabase.from('virtual_rooms').insert({ room_name: name, topic: topic, meet_link: link, created_by: currentUser.id, creator_name: currentUser.user_metadata.full_name, is_public: isPublic, allowed_users: allowed });
            if (!error) { closeModal('roomModal'); loadRooms(); alert("Oda açıldı!"); } else alert("Hata: " + error.message);
        }

        async function fetchAllUsers() { const { data } = await supabase.from('profiles').select('id, full_name, user_type'); if(data) allUsers = data; renderUserList(allUsers); }
        function toggleUserSelect() { document.getElementById('userSelectGroup').style.display = document.getElementById('isPublic').checked ? 'none' : 'block'; }
        function renderUserList(users) {
            const container = document.getElementById('userListContainer');
            container.innerHTML = users.map(u => {
                if(u.id === currentUser.id) return '';
                const isSelected = selectedUserIds.includes(u.id);
                return `<div class="user-option" onclick="toggleUser('${u.id}')" style="background:${isSelected ? '#e0f2f1':''}">${u.full_name} ${isSelected ? '✅' : ''}</div>`;
            }).join('');
        }
        function filterUsers(q) { renderUserList(allUsers.filter(u => u.full_name.toLowerCase().includes(q.toLowerCase()))); }
        function toggleUser(id) { if(selectedUserIds.includes(id)) selectedUserIds = selectedUserIds.filter(uid => uid !== id); else selectedUserIds.push(id); renderSelectedUsers(); filterUsers(document.querySelector('input[placeholder="İsim ara..."]').value); }
        function renderSelectedUsers() { document.getElementById('selectedContainer').innerHTML = selectedUserIds.map(id => { const u = allUsers.find(x => x.id === id); return `<div class="user-chip">${u.full_name} <i class="fa-solid fa-times" onclick="toggleUser('${id}')"></i></div>`; }).join(''); }
        function generateLink() { document.getElementById('rLink').value = `https://meet.jit.si/HatayODTU-${Math.random().toString(36).substring(7)}`; }
        async function deleteRoom(id) { if(confirm("Silmek istediğinize emin misiniz?")) { const { error } = await supabase.from('virtual_rooms').delete().eq('id', id); if (!error) loadRooms(); } }
        function openModal() { document.getElementById('roomModal').style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>
</body>
</html>
