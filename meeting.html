<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etkinlik Üssü - Hatay ODTÜ MD</title>

<script src='https://meet.jit.si/external_api.js'></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* STİLLER (AYNI KALDI) */
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f4f6f9; --white: #ffffff; --meet-green: #00796b; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); display: block; min-height: 100vh; }

    /* NAVBAR */
    .navbar { width: 100%; height: 70px; background-color: var(--odtu-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-logo { height: 50px; background: white; padding: 2px; border-radius: 5px; }
    .nav-title { color: white; font-size: 1.1rem; font-weight: bold; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: #bdc3c7; text-decoration: none; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { background-color: rgba(255,255,255,0.1); color: white; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .logout-btn { color: #e74c3c; border: 1px solid #e74c3c; padding: 6px 15px; border-radius: 20px; text-decoration: none; transition: 0.3s; }
    .logout-btn:hover { background: #e74c3c; color: white; }

    /* İÇERİK */
    .main-content { margin-top: 70px; padding: 40px; width: 100%; max-width: 1200px; margin-left: auto; margin-right: auto; }
    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .create-btn { background: var(--odtu-red); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
    
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    .room-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; border-top: 5px solid var(--meet-green); display: flex; flex-direction: column; transition: 0.3s; }
    .room-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    
    .room-status { position: absolute; top: 15px; right: 15px; background: #e0f2f1; color: var(--meet-green); padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; gap: 5px; }
    .pulsing-dot { width: 8px; height: 8px; background-color: var(--meet-green); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .room-title { font-size: 1.2rem; font-weight: bold; color: #333; margin-bottom: 5px; }
    .room-topic { color: #666; font-size: 0.9rem; margin-bottom: 20px; flex: 1; }
    .room-host { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.85rem; color: #555; }
    .host-avatar { width: 30px; height: 30px; background: #eee; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #777; }

    .join-btn { width: 100%; padding: 10px; background: var(--meet-green); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: block; text-align: center; transition: 0.3s; }
    .join-btn:hover { background: #004d40; }
    .delete-btn { background: transparent; color: #999; border: none; cursor: pointer; font-size: 0.8rem; margin-top: 10px; width: 100%; text-decoration: underline; }
    
    /* MODAL (YENİ ODA FORMU) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: none; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; animation: slideDown 0.3s; }
    @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    .input-wrapper { display: flex; gap: 10px; }
    .btn-generate { background: #3498db; color: white; border: none; padding: 0 15px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    .btn-generate:hover { background: #2980b9; }

    /* --- 2. SİNEMA MODU (VIDEO MODAL) STİLLERİ EKLENDİ --- */
    #cinemaModal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #000; z-index: 3000; flex-direction: column;
    }
    #meet-frame { flex: 1; width: 100%; background: #000; }
    .cinema-header {
        height: 50px; background: #111; color: white; display: flex; 
        justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid #333;
    }
    .btn-close-cinema {
        background: #e74c3c; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
    }

    /* MOBİL */
    @media (max-width: 900px) {
        .navbar { height: auto; flex-direction: column; padding: 15px; }
        .nav-links { flex-wrap: wrap; justify-content: center; width: 100%; gap: 10px; }
        .nav-links a { background-color: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 20px; font-size: 0.85rem; flex: 1 1 auto; justify-content: center; }
        .main-content { margin-top: 0; padding: 20px; }
        .header-area { flex-direction: column; gap: 20px; text-align: center; }
        .create-btn { width: 100%; justify-content: center; }
        .rooms-grid { grid-template-columns: 1fr; }
        .modal-content { width: 95%; padding: 20px; }
    }
</style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left"><img src="logo.jpg" class="nav-logo"><div class="nav-title">Hatay ODTÜ MD <span>Üye Portalı</span></div></div>
        <div class="nav-links">
            <a href="dashboard.html"><i class="fa-solid fa-layer-group"></i> Panel</a>
            <a href="meeting.html" class="active"><i class="fa-solid fa-video"></i> Etkinlik Üssü</a>
            <a href="mentor.html"><i class="fa-solid fa-handshake-angle"></i> Mentorluk</a>
            <a href="career.html"><i class="fa-solid fa-briefcase"></i> Kariyer</a>
            <a href="network.html"><i class="fa-solid fa-users-viewfinder"></i> Mezun Ağı</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Ayarlar</a>
        </div>
        <div class="nav-right"><a href="#" class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</a></div>
    </nav>

    <div class="main-content">
        <div class="header-area">
            <div>
                <h2>🎥 Meeting Hub</h2>
                <p style="color:#666;">Çalışma grupları kur, linki otomatik üret ve sohbete başla.</p>
            </div>
            <button class="create-btn" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> Oda Oluştur
            </button>
        </div>

        <div class="rooms-grid" id="roomsList">
            <div style="text-align:center; width:100%; padding:40px; color:#999; grid-column: 1/-1;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Yükleniyor...
            </div>
        </div>
    </div>

    <div id="roomModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3>Yeni Oda Aç</h3>
                <span onclick="closeModal()" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            <div class="form-group">
                <label>Oda Başlığı</label>
                <input type="text" id="rName" class="form-control" placeholder="Örn: İngilizce Konuşma Kulübü">
            </div>
            <div class="form-group">
                <label>Konu / Açıklama</label>
                <input type="text" id="rTopic" class="form-control" placeholder="Örn: Herkes davetlidir.">
            </div>
            <div class="form-group">
                <label>Toplantı Linki</label>
                <div class="input-wrapper">
                    <input type="url" id="rLink" class="form-control" placeholder="Link buraya gelecek...">
                    <button class="btn-generate" type="button" onclick="generateAutoLink()">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Link Üret
                    </button>
                </div>
                <small style="color:#777; font-size:0.75rem;">Google Meet linki yapıştırabilir veya 'Link Üret' diyerek anında oluşturabilirsin.</small>
            </div>
            <button onclick="createRoom()" style="width:100%; padding:12px; background:var(--odtu-dark); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Odayı Başlat</button>
        </div>
    </div>

    <div id="cinemaModal">
        <div class="cinema-header">
            <span id="cinemaTitle" style="font-weight:bold; font-size:1.1rem;">Toplantı</span>
            <button class="btn-close-cinema" onclick="closeCinemaMode()">Görüşmeyi Sonlandır</button>
        </div>
        <div id="meet-frame"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        let currentUser = null;
        let apiObj = null; // Jitsi API nesnesi

        document.addEventListener("DOMContentLoaded", async () => {
            if(!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            currentUser = session.user;
            if(!currentUser.user_metadata.full_name) {
                const { data } = await supabase.from('profiles').select('full_name').eq('id', currentUser.id).single();
                currentUser.user_metadata.full_name = data?.full_name || "Üye";
            }
            loadRooms();
        });

        async function loadRooms() {
            const list = document.getElementById('roomsList');
            const { data, error } = await supabase.from('virtual_rooms').select('*').order('created_at', { ascending: false });

            if (error) { console.error(error); return; }
            if (!data || data.length === 0) { list.innerHTML = '<div style="text-align:center; padding:40px; color:#777; grid-column: 1/-1;">Aktif oda yok.</div>'; return; }

            list.innerHTML = '';
            data.forEach(room => {
                const isMyRoom = (room.created_by === currentUser.id);
                const deleteBtn = isMyRoom ? `<button class="delete-btn" onclick="deleteRoom(${room.id})">Odayı Kapat</button>` : '';
                const avatarInitials = room.creator_name ? room.creator_name.substring(0,2).toUpperCase() : 'ME';

                // 4. BUTON ARTIK SİNEMA MODUNU AÇIYOR
                list.insertAdjacentHTML('beforeend', `
                <div class="room-card">
                    <div class="room-status"><div class="pulsing-dot"></div> Canlı</div>
                    <div class="room-title">${room.room_name}</div>
                    <div class="room-topic">${room.topic || ''}</div>
                    <div class="room-host"><div class="host-avatar">${avatarInitials}</div><div>Moderatör: <strong>${room.creator_name}</strong></div></div>
                    <button onclick="openCinemaMode('${room.meet_link}', '${room.room_name}')" class="join-btn"><i class="fa-solid fa-video"></i> Katıl</button>
                    ${deleteBtn}
                </div>`);
            });
        }

        // 5. SİNEMA MODU FONKSİYONLARI (YENİ)
        function openCinemaMode(linkUrl, title) {
            // Linkin sonundaki oda ismini ayıkla (https://meet.jit.si/HatayODTU-XYZ -> HatayODTU-XYZ)
            // Eğer Jitsi linki değilse (örn: Zoom), yeni sekmede açmak daha güvenli olabilir, ama burada Jitsi varsayıyoruz.
            
            let roomName = "";
            if(linkUrl.includes("meet.jit.si")) {
                const parts = linkUrl.split('/');
                roomName = parts[parts.length - 1];
            } else {
                // Jitsi linki değilse direkt yeni sekmede aç
                window.open(linkUrl, '_blank');
                return;
            }

            document.getElementById('cinemaModal').style.display = 'flex';
            document.getElementById('cinemaTitle').innerText = title;

            // Jitsi Başlat
            const domain = 'meet.jit.si';
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#meet-frame'),
                userInfo: { displayName: currentUser.user_metadata.full_name },
                configOverwrite: { 
                    startWithAudioMuted: false, 
                    startWithVideoMuted: true // Kamera yoksa hata vermesin diye kapalı başlar
                },
                interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false }
            };

            apiObj = new JitsiMeetExternalAPI(domain, options);
            
            // Kullanıcı "Kapat" butonuna basarsa kapat
            apiObj.addEventListeners({
                videoConferenceLeft: function () {
                    closeCinemaMode();
                }
            });
        }

        function closeCinemaMode() {
            if(apiObj) apiObj.dispose(); // API'yi temizle
            document.getElementById('cinemaModal').style.display = 'none';
            document.querySelector('#meet-frame').innerHTML = ""; // İçeriği boşalt
        }

        function generateAutoLink() {
            const uniqueId = Math.random().toString(36).substring(7);
            const link = `https://meet.jit.si/HatayODTU-${uniqueId}`;
            
            document.getElementById('rLink').value = link;
            const input = document.getElementById('rLink');
            input.style.borderColor = "#27ae60";
            input.style.backgroundColor = "#e8f5e9";
            setTimeout(() => { input.style.borderColor = "#ddd"; input.style.backgroundColor = "white"; }, 500);
        }

        async function createRoom() {
            const name = document.getElementById('rName').value;
            const topic = document.getElementById('rTopic').value;
            const link = document.getElementById('rLink').value;

            if (!name || !link) { alert("Başlık ve Link zorunludur!"); return; }
            
            const { error } = await supabase.from('virtual_rooms').insert({
                room_name: name, topic: topic, meet_link: link,
                created_by: currentUser.id, creator_name: currentUser.user_metadata.full_name
            });

            if (!error) { closeModal(); loadRooms(); alert("Oda açıldı!"); }
            else alert("Hata: " + error.message);
        }

        async function deleteRoom(id) {
            if(confirm("Odayı kapatmak istiyor musunuz?")) {
                await supabase.from('virtual_rooms').delete().eq('id', id);
                loadRooms();
            }
        }

        function openModal() { document.getElementById('roomModal').style.display='flex'; }
        function closeModal() { document.getElementById('roomModal').style.display='none'; }
        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>

</body>
</html>
