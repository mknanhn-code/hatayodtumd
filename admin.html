<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim Paneli - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* ... (CSS Kodları Aynı Kalacak) ... */
    :root { --admin-dark: #1e293b; --admin-light: #f1f5f9; --accent: #E31E24; --text: #334155; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { display: flex; background-color: var(--admin-light); min-height: 100vh; color: var(--text); }
    /* ... Diğer CSS stilleri aynı ... */
    
    /* Yan Menü ve İçerik Stilleri (Önceki kodla aynı) */
    .sidebar { width: 250px; background: var(--admin-dark); color: white; display: flex; flex-direction: column; position: fixed; height: 100%; top: 0; left: 0; padding: 20px; z-index: 100; }
    .main { margin-left: 250px; padding: 40px; flex: 1; }
    
    /* Tablo, Kart ve Buton Stilleri */
    .table-container { background: white; padding: 20px; border-radius: 10px; overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-no { background: #fee2e2; color: #991b1b; } /* Onaysız */
    .badge-yes { background: #dcfce7; color: #166534; } /* Onaylı */
    
    .btn { padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: bold; margin-right: 5px; }
    .btn-approve { background: #10b981; }
    .btn-block { background: #f59e0b; }
    .btn-role { background: #3b82f6; }
    .btn-del { background: #ef4444; }
    
    @media(max-width:900px){ .sidebar{display:none;} .main{margin:0; padding:10px;} }
</style>
</head>
<body>

    <div class="sidebar">
        <h3 style="margin-bottom:20px;">Yönetim Paneli</h3>
        <div onclick="loadUsers()" style="cursor:pointer; margin-bottom:10px;">Üyeler</div>
        <div onclick="logout()" style="cursor:pointer; color:#ef4444;">Çıkış</div>
    </div>

    <div class="main">
        <h2>Üye Yönetimi ve Onay</h2>
        <div class="table-container">
            <table id="userTable">
                <thead><tr><th>Ad Soyad</th><th>Tip</th><th>Onay Durumu</th><th>İşlemler</th></tr></thead>
                <tbody id="userListBody"></tbody>
            </table>
        </div>
    </div>

    <div id="liveToast" style="position:fixed; top:20px; right:20px; background:white; padding:15px; display:none; border-left:5px solid green;">...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            // Admin Kontrolü
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
            if (!profile || !profile.roles || !profile.roles.includes('admin')) {
                alert("Yetkisiz Giriş!"); window.location.href = 'dashboard.html'; return;
            }
            loadUsers();
        });

        // --- KULLANICI LİSTELEME (GÜNCELLENDİ) ---
        async function loadUsers() {
            const { data } = await supabase.from('profiles').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('userListBody');
            tbody.innerHTML = '';

            data.forEach(u => {
                // ONAY DURUMU KONTROLÜ
                const isApproved = u.is_approved === true;
                
                let statusBadge = isApproved 
                    ? `<span class="badge badge-yes">✅ ONAYLI</span>` 
                    : `<span class="badge badge-no">❌ ONAY BEKLİYOR</span>`;

                // BUTONLAR
                // Eğer onaylıysa -> "Erişimi Kapat" butonu çıkar
                // Onaysızsa -> "Onayla" butonu çıkar
                let approveBtn = isApproved 
                    ? `<button class="btn btn-block" onclick="toggleApproval('${u.id}', false)">🚫 Erişimi Kapat</button>`
                    : `<button class="btn btn-approve" onclick="toggleApproval('${u.id}', true)">✅ Onayla (Giriş İzni Ver)</button>`;
                
                let roleBtn = `<button class="btn btn-role" onclick="manageRole('${u.id}', '${u.roles}')">🛡️ Rol</button>`;
                let deleteBtn = `<button class="btn btn-del" onclick="deleteUser('${u.id}')">Sil</button>`;

                tbody.innerHTML += `
                <tr>
                    <td><b>${u.full_name}</b><br><small>${u.email}</small></td>
                    <td>${u.user_type === 'student' ? 'Öğrenci' : 'Mezun'}</td>
                    <td>${statusBadge}</td>
                    <td>
                        ${approveBtn}
                        ${roleBtn}
                        ${deleteBtn}
                    </td>
                </tr>`;
            });
        }

        // --- ONAY AÇMA / KAPAMA (TEK FONKSİYON) ---
        async function toggleApproval(id, status) {
            const action = status ? "ONAYLAMAK" : "ERİŞİMİ KAPATMAK";
            if(confirm(`Bu kullanıcıyı ${action} istediğinize emin misiniz?`)) {
                
                // Sadece is_approved alanını güncelliyoruz. Rollerle oynamıyoruz.
                const { error } = await supabase.from('profiles').update({ is_approved: status }).eq('id', id);
                
                if(error) alert("Hata: " + error.message);
                else { 
                    showToast(status ? "Kullanıcı Onaylandı!" : "Erişim Kapatıldı."); 
                    loadUsers(); 
                }
            }
        }

        // ROL YÖNETİMİ (AYNI KALDI)
        async function manageRole(id, currentRoles) {
            const input = prompt("Rolleri virgülle girin (örn: admin, mentor):", currentRoles);
            if(input !== null) {
                const newRoles = input.split(',').map(r => r.trim()).filter(r => r !== "");
                const { error } = await supabase.from('profiles').update({ roles: newRoles }).eq('id', id);
                if(!error) { showToast("Roller Güncellendi!"); loadUsers(); }
            }
        }

        // TAM SİLME (AYNI KALDI)
        async function deleteUser(id) {
            if(!confirm("Kullanıcı tamamen silinecek. Emin misiniz?")) return;
            const { error } = await supabase.rpc('delete_user_fully', { target_user_id: id });
            if(error) {
                alert("Auth silinemedi, profil siliniyor...");
                await supabase.from('profiles').delete().eq('id', id);
            } else {
                showToast("Silindi.");
                loadUsers();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('liveToast');
            t.innerText = msg; t.style.display='block';
            setTimeout(()=>t.style.display='none', 3000);
        }
        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>
</body>
</html>
