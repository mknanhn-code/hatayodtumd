<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilim - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* ORTAK STİLLER */
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f4f6f9; --white: #ffffff; --msg-bg: #e8f5e9; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); display: block; min-height: 100vh; }

    /* NAVBAR */
    .navbar { width: 100%; height: 70px; background-color: var(--odtu-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; }
    .nav-links a { color: #bdc3c7; text-decoration: none; margin-left: 20px; font-size: 0.95rem; position: relative; }
    .nav-links a:hover, .nav-links a.active { color: white; }
    
    /* BİLDİRİM ROZETİ (Notification Badge) */
    .badge-count { position: absolute; top: -8px; right: -10px; background: var(--odtu-red); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; display: none; }

    .main-content { margin-top: 70px; padding: 30px; max-width: 1100px; margin-left: auto; margin-right: auto; }
    
    /* TAB YAPISI */
    .tab-header { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .tab-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #777; padding: 10px; font-weight: bold; }
    .tab-btn.active { color: var(--odtu-dark); border-bottom: 3px solid var(--odtu-red); }
    
    .tab-content { display: none; animation: fadeIn 0.3s; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* NOTLAR BÖLÜMÜ */
    .notes-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .note-editor textarea { width: 100%; height: 150px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; resize: none; }
    .btn-save { background: var(--odtu-dark); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    
    .notes-list { max-height: 400px; overflow-y: auto; }
    .note-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #f39c12; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
    .delete-note { position: absolute; top: 10px; right: 10px; color: #e74c3c; cursor: pointer; }

    /* MESAJLAR BÖLÜMÜ */
    .messages-layout { display: flex; gap: 20px; height: 500px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .msg-sidebar { width: 30%; background: #f8f9fa; border-right: 1px solid #eee; padding: 15px; overflow-y: auto; }
    .msg-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
    
    .msg-item { padding: 15px; background: white; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .msg-item:hover { background: #e9ecef; }
    .msg-item.unread { border-left: 4px solid var(--odtu-red); font-weight: bold; }
    
    #chatBox { flex: 1; overflow-y: auto; margin-bottom: 15px; border: 1px solid #eee; padding: 15px; border-radius: 8px; background: #fafafa; }
    .chat-bubble { max-width: 70%; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; font-size: 0.9rem; position: relative; }
    .mine { background: var(--odtu-dark); color: white; margin-left: auto; border-bottom-right-radius: 2px; }
    .theirs { background: #e0e0e0; color: #333; margin-right: auto; border-bottom-left-radius: 2px; }
    
    .send-area { display: flex; gap: 10px; }
    .send-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    .send-btn { background: var(--odtu-red); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

    /* Yeni Mesaj Butonu */
    .new-msg-btn { width: 100%; padding: 10px; background: var(--odtu-red); color: white; border: none; border-radius: 6px; margin-bottom: 15px; cursor: pointer; }

    /* Modal (Kullanıcı Seçimi) */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
    .modal-box { background: white; padding: 20px; border-radius: 10px; width: 300px; max-height: 400px; overflow-y: auto; }
    .user-row { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    .user-row:hover { background: #f9f9f9; }

    @media (max-width: 768px) {
        .notes-container { grid-template-columns: 1fr; }
        .messages-layout { flex-direction: column; height: auto; }
        .msg-sidebar { width: 100%; height: 200px; }
        .msg-content { height: 400px; }
    }
</style>
</head>
<body>

    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="logo.jpg" style="height:40px; background:white; padding:2px; border-radius:4px;">
            <span style="color:white; font-weight:bold;">Profilim</span>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Panel</a>
            <a href="profile.html" class="active">
                <i class="fa-solid fa-user"></i> Profil <span id="navBadge" class="badge-count">0</span>
            </a>
            <a href="#" onclick="logout()">Çıkış</a>
        </div>
    </nav>

    <div class="main-content">
        
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('notes')"><i class="fa-solid fa-sticky-note"></i> Notlarım</button>
            <button class="tab-btn" onclick="switchTab('messages')"><i class="fa-solid fa-envelope"></i> Mesajlar</button>
        </div>

        <div id="notes" class="tab-content active">
            <div class="notes-container">
                <div class="note-editor">
                    <h3>📝 Yeni Not Al</h3>
                    <textarea id="noteInput" placeholder="Bugün neler yapacaksın?"></textarea>
                    <button class="btn-save" onclick="saveNote()">Kaydet</button>
                </div>
                <div class="notes-list" id="notesList">
                    <p style="text-align:center; color:#999; margin-top:20px;">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div id="messages" class="tab-content">
            <div class="messages-layout">
                <div class="msg-sidebar">
                    <button class="new-msg-btn" onclick="openUserModal()">+ Yeni Mesaj</button>
                    <div id="inboxList">
                        </div>
                </div>
                <div class="msg-content">
                    <div id="chatBox">
                        <div style="text-align:center; color:#ccc; margin-top:50px;">
                            <i class="fa-regular fa-comments" style="font-size:3rem;"></i><br>
                            Bir konuşma seçin veya başlatın.
                        </div>
                    </div>
                    <div class="send-area" style="display:none;" id="sendArea">
                        <input type="text" id="msgInput" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="userModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3>Kime Mesaj?</h3>
            <div id="userList">Yükleniyor...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        
        let currentUser = null;
        let activeChatUserId = null; // Şu an kiminle konuşuyoruz?

        document.addEventListener("DOMContentLoaded", async () => {
            if(!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            loadNotes();
            loadInbox();
            checkNotifications(); // Bildirimleri kontrol et
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // --- NOT İŞLEMLERİ ---
        async function saveNote() {
            const content = document.getElementById('noteInput').value;
            if(!content) return;
            
            await supabase.from('personal_notes').insert({ user_id: currentUser.id, content: content });
            document.getElementById('noteInput').value = "";
            loadNotes();
        }

        async function loadNotes() {
            const { data } = await supabase.from('personal_notes').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            const list = document.getElementById('notesList');
            list.innerHTML = "";
            data.forEach(note => {
                list.innerHTML += `
                <div class="note-card">
                    ${note.content}
                    <i class="fa-solid fa-trash delete-note" onclick="deleteNote(${note.id})"></i>
                    <div style="font-size:0.7rem; color:#999; margin-top:10px;">${new Date(note.created_at).toLocaleDateString()}</div>
                </div>`;
            });
        }

        async function deleteNote(id) {
            if(confirm("Sileyim mi?")) {
                await supabase.from('personal_notes').delete().eq('id', id);
                loadNotes();
            }
        }

        // --- MESAJLAŞMA İŞLEMLERİ ---
        
        // 1. Gelen Kutusunu Yükle (Son konuşulanlar)
        async function loadInbox() {
            // Basitlik için sadece bana gelen mesajları gönderenlere göre grupluyoruz
            // Gerçek bir sistemde daha karmaşık bir sorgu gerekir.
            const { data } = await supabase.from('direct_messages')
                .select('sender_id, sender_name, content, created_at, is_read')
                .eq('receiver_id', currentUser.id)
                .order('created_at', {ascending: false});

            const inboxList = document.getElementById('inboxList');
            const uniqueSenders = new Set();
            inboxList.innerHTML = "";

            if(data) {
                data.forEach(msg => {
                    if(!uniqueSenders.has(msg.sender_id)) {
                        uniqueSenders.add(msg.sender_id);
                        const isUnread = !msg.is_read ? 'unread' : '';
                        inboxList.innerHTML += `
                        <div class="msg-item ${isUnread}" onclick="openChat('${msg.sender_id}', '${msg.sender_name}')">
                            <div style="font-weight:bold;">${msg.sender_name || 'Bilinmeyen'}</div>
                            <div style="font-size:0.8rem; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${msg.content}</div>
                        </div>`;
                    }
                });
            }
        }

        // 2. Yeni Mesaj İçin Kullanıcı Seç
        async function openUserModal() {
            document.getElementById('userModal').style.display = 'flex';
            const { data } = await supabase.from('profiles').select('id, full_name').neq('id', currentUser.id).limit(20);
            const list = document.getElementById('userList');
            list.innerHTML = "";
            data.forEach(u => {
                list.innerHTML += `<div class="user-row" onclick="startNewChat('${u.id}', '${u.full_name}')">${u.full_name}</div>`;
            });
        }

        function startNewChat(id, name) {
            document.getElementById('userModal').style.display = 'none';
            openChat(id, name);
        }

        // 3. Sohbeti Aç
        async function openChat(partnerId, partnerName) {
            activeChatUserId = partnerId;
            document.getElementById('sendArea').style.display = 'flex';
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = `<div style="text-align:center; padding:10px; font-weight:bold;">${partnerName} ile sohbet</div>`;

            // Mesajları Getir (Hem gelen hem giden)
            const { data } = await supabase.from('direct_messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', {ascending: true});

            data.forEach(msg => {
                const type = msg.sender_id === currentUser.id ? 'mine' : 'theirs';
                chatBox.innerHTML += `<div class="chat-bubble ${type}">${msg.content}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;

            // Okundu olarak işaretle
            await supabase.from('direct_messages').update({is_read: true}).eq('sender_id', partnerId).eq('receiver_id', currentUser.id);
            checkNotifications(); // Rozeti güncelle
        }

        // 4. Mesaj Gönder
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value;
            if(!text || !activeChatUserId) return;

            // Kendi adını bul
            const myName = currentUser.user_metadata.full_name || "Üye";

            const { error } = await supabase.from('direct_messages').insert({
                sender_id: currentUser.id,
                receiver_id: activeChatUserId,
                content: text,
                sender_name: myName
            });

            if(!error) {
                document.getElementById('chatBox').innerHTML += `<div class="chat-bubble mine">${text}</div>`;
                input.value = "";
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }
        }

        // --- BİLDİRİMLER (Rozet) ---
        async function checkNotifications() {
            const { count } = await supabase.from('direct_messages')
                .select('*', { count: 'exact', head: true })
                .eq('receiver_id', currentUser.id)
                .eq('is_read', false);
            
            const badge = document.getElementById('navBadge');
            if(count > 0) {
                badge.style.display = 'inline-block';
                badge.innerText = count;
            } else {
                badge.style.display = 'none';
            }
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>

</body>
</html>
