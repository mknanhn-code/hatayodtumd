<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil & Ayarlar - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* --- GENEL STİLLER --- */
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f4f6f9; --white: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); display: block; min-height: 100vh; }

    /* NAVBAR */
    .navbar { width: 100%; height: 70px; background-color: var(--odtu-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-logo { height: 50px; background: white; padding: 2px; border-radius: 5px; }
    .nav-title { color: white; font-size: 1.1rem; font-weight: bold; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: #bdc3c7; text-decoration: none; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; transition: 0.3s; position: relative; }
    .nav-links a:hover, .nav-links a.active { background-color: rgba(255,255,255,0.1); color: white; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .logout-btn { color: #e74c3c; border: 1px solid #e74c3c; padding: 6px 15px; border-radius: 20px; text-decoration: none; transition: 0.3s; }
    .logout-btn:hover { background: #e74c3c; color: white; }

    /* BİLDİRİM ROZETİ */
    .badge-count { position: absolute; top: -8px; right: -10px; background: var(--odtu-red); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; display: none; border: 1px solid white; }

    /* İÇERİK ALANI */
    .main-content { margin-top: 70px; padding: 30px; max-width: 1000px; margin-left: auto; margin-right: auto; }

    /* SEKME YAPISI */
    .tab-header { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #ddd; padding-bottom: 0; overflow-x: auto; }
    .tab-btn { background: none; border: none; font-size: 1rem; cursor: pointer; color: #777; padding: 15px 20px; font-weight: bold; transition: 0.3s; border-bottom: 3px solid transparent; position: relative; }
    .tab-btn:hover { color: var(--odtu-red); background: rgba(0,0,0,0.02); }
    .tab-btn.active { color: var(--odtu-dark); border-bottom: 3px solid var(--odtu-red); background: white; border-radius: 8px 8px 0 0; }
    
    /* SEKME İÇİ BİLDİRİM NOKTASI */
    .tab-badge { display: none; background: var(--odtu-red); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }

    .tab-content { display: none; animation: fadeIn 0.4s; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* 1. AYARLAR STİLİ */
    .settings-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
    .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
    .form-group { flex: 1; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; transition: 0.3s; }
    .form-group input:focus { border-color: var(--odtu-red); }
    .form-group input[readonly] { background: #f9f9f9; cursor: not-allowed; }
    .btn-save { background-color: var(--odtu-red); color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; float: right; font-weight: bold; }

    /* 2. NOTLAR STİLİ */
    .notes-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .note-editor textarea { width: 100%; height: 150px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; resize: none; outline: none; }
    .btn-add-note { background: var(--odtu-dark); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .notes-list { max-height: 400px; overflow-y: auto; }
    .note-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #f39c12; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
    .delete-note { position: absolute; top: 10px; right: 10px; color: #e74c3c; cursor: pointer; }

    /* 3. MESAJLAR STİLİ */
    .messages-layout { display: flex; gap: 20px; height: 500px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .msg-sidebar { width: 35%; background: #f8f9fa; border-right: 1px solid #eee; padding: 15px; overflow-y: auto; }
    .msg-content { flex: 1; padding: 20px; display: flex; flex-direction: column; background: white; }
    
    .msg-item { padding: 15px; background: white; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #eee; }
    .msg-item:hover { background: #e9ecef; }
    .msg-item.unread { border-left: 4px solid var(--odtu-red); font-weight: bold; background: #fff5f5; }
    
    #chatBox { flex: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
    .chat-bubble { max-width: 75%; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; font-size: 0.9rem; position: relative; }
    .mine { background: var(--odtu-dark); color: white; margin-left: auto; border-bottom-right-radius: 2px; }
    .theirs { background: #e0e0e0; color: #333; margin-right: auto; border-bottom-left-radius: 2px; }
    
    /* GÜNCELLENEN MESAJ ALANI STİLİ */
    .send-area { display: flex; gap: 10px; align-items: center; border-top: 1px solid #eee; padding-top: 10px; }
    .send-area textarea { 
        flex: 1; 
        padding: 12px; 
        border: 1px solid #ddd; 
        border-radius: 10px; 
        outline: none; 
        resize: none; /* Boyutlandırmayı kapat */
        height: 50px; /* Yükseklik */
        font-family: inherit;
    }
    .send-area textarea:focus { border-color: var(--odtu-dark); }
    
    .send-btn { background: var(--odtu-red); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .send-btn:hover { background: #c0392b; transform: scale(1.05); }
    
    .new-msg-btn { width: 100%; padding: 12px; background: var(--odtu-dark); color: white; border: none; border-radius: 6px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }

    /* YENİ: ÇOKLU SEÇİM MODALI */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
    .modal-box { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; }
    .user-row { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .user-row:hover { background: #f9f9f9; }
    .user-checkbox { width: 18px; height: 18px; cursor: pointer; }
    
    .multi-send-area { border-top: 1px solid #eee; padding-top: 15px; margin-top: 10px; }
    .btn-multi-send { width: 100%; background: var(--odtu-red); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-multi-send:disabled { background: #ccc; cursor: not-allowed; }

    /* BİLDİRİM ANİMASYONU */
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* MOBİL */
    @media (max-width: 900px) {
        .navbar { height: auto; flex-direction: column; padding: 15px; }
        .nav-links { flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
        .nav-links a { flex: 1 1 auto; justify-content: center; }
        .main-content { margin-top: 0; padding: 20px; }
        .form-row { flex-direction: column; gap: 0; }
        .notes-container { grid-template-columns: 1fr; }
        .messages-layout { flex-direction: column; height: auto; }
        .msg-sidebar { width: 100%; height: 250px; border-right: none; border-bottom: 1px solid #eee; }
        .msg-content { height: 400px; }
        .btn-save { width: 100%; margin-top: 10px; }
    }
</style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="logo.png" class="nav-logo" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/tr/a/a6/Odt%C3%BC_logo.png';">
            <div class="nav-title">Hatay ODTÜ MD <span>Üye Portalı</span></div>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Panel</a>
            <a href="meeting.html">Etkinlik Üssü</a>
            <a href="mentor.html">Mentorluk</a>
            <a href="career.html">Kariyer</a>
            <a href="network.html">Mezun Ağı</a>
            <a href="profile.html" class="active">
                <i class="fa-solid fa-user"></i> Profil 
                <span id="navBadge" class="badge-count">0</span>
            </a>
        </div>
        <div class="nav-right">
            <a href="#" class="logout-btn" onclick="logout()">Çıkış</a>
        </div>
    </nav>

    <div class="main-content">
        
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i> Ayarlar</button>
            <button class="tab-btn" onclick="switchTab('notes')"><i class="fa-solid fa-sticky-note"></i> Notlarım</button>
            <button class="tab-btn" onclick="switchTab('messages')">
                <i class="fa-solid fa-envelope"></i> Mesajlar 
                <span id="tabBadge" class="tab-badge">0</span>
            </button>
        </div>

        <div id="settings" class="tab-content active">
            <div class="settings-card">
                <h3>Kişisel Bilgiler</h3>
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group"><label>Ad Soyad</label><input type="text" id="pName" readonly></div>
                        <div class="form-group"><label>E-posta</label><input type="email" id="pEmail" readonly></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Bölüm</label><input type="text" id="pDept" placeholder="Bölümünüz"></div>
                        <div class="form-group"><label>Mezuniyet Yılı</label><input type="number" id="pYear" placeholder="20XX"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Kurum / Şirket</label><input type="text" id="pComp"></div>
                        <div class="form-group"><label>Telefon</label><input type="text" id="pPhone"></div>
                    </div>
                    <button type="submit" id="saveBtn" class="btn-save">Değişiklikleri Kaydet</button>
                    <div style="clear:both;"></div>
                </form>
            </div>
        </div>

        <div id="notes" class="tab-content">
            <div class="notes-container">
                <div class="note-editor">
                    <h3>📝 Yeni Not</h3>
                    <textarea id="noteInput" placeholder="Aklına gelenleri buraya not al..."></textarea>
                    <button class="btn-add-note" onclick="saveNote()">Notu Kaydet</button>
                </div>
                <div class="notes-list" id="notesList"></div>
            </div>
        </div>

        <div id="messages" class="tab-content">
            <div class="messages-layout">
                <div class="msg-sidebar">
                    <button class="new-msg-btn" onclick="openUserModal()">+ Yeni / Çoklu Mesaj</button>
                    <div id="inboxList">Yükleniyor...</div>
                </div>
                <div class="msg-content">
                    <div id="chatBox">
                        <div style="text-align:center; color:#ccc; margin-top:50px;">
                            <i class="fa-regular fa-comments" style="font-size:3rem;"></i><br><br>
                            Bir konuşma seçin veya yeni mesaj gönderin.
                        </div>
                    </div>
                    
                    <div class="send-area" style="display:none;" id="sendArea">
                        <textarea id="msgInput" placeholder="Mesaj yaz... (Enter: Gönder, Shift+Enter: Alt Satır)"></textarea>
                        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <div id="userModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h3>Kişi Seç (Tek veya Çoklu)</h3>
                <span onclick="document.getElementById('userModal').style.display='none'" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            
            <div style="max-height: 250px; overflow-y: auto;" id="userList"></div>

            <div class="multi-send-area">
                <input type="text" id="multiMsgInput" placeholder="Çoklu mesajınızı yazın..." style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px; display:none;">
                <button id="btnMultiSend" class="btn-multi-send" disabled onclick="sendMultiMessage()">Seçilenlere Gönder (0)</button>
            </div>
        </div>
    </div>

    <div id="liveToast" style="position: fixed; top: 20px; right: 20px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); border-left: 6px solid #333; z-index: 9999; display: none; min-width: 320px; animation: slideIn 0.4s;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong id="toastTitle" style="font-size:1rem; display:flex; align-items:center; gap:8px;"></strong>
            <span onclick="document.getElementById('liveToast').style.display='none'" style="cursor:pointer; color:#aaa; font-size:1.2rem;">&times;</span>
        </div>
        <p id="toastMessage" style="color:#555; font-size:0.9rem; margin:0; line-height:1.4;">...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        let currentUser = null;
        let activeChatUserId = null;
        let selectedUsers = new Set(); 

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            loadProfile(); loadNotes(); loadInbox(); checkNotifications(); setupRealtime();
            
            // Enter ile gönderme (Shift+Enter alt satır)
            document.getElementById('msgInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const buttons = document.querySelectorAll('.tab-btn');
            if(tabId === 'settings') buttons[0].classList.add('active');
            if(tabId === 'notes') buttons[1].classList.add('active');
            if(tabId === 'messages') buttons[2].classList.add('active');
        }

        // --- PROFİL & NOTLAR ---
        async function loadProfile() {
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile) {
                document.getElementById('pName').value = profile.full_name;
                document.getElementById('pEmail').value = profile.email;
                document.getElementById('pDept').value = profile.department || "";
                document.getElementById('pYear').value = profile.grad_year || "";
                document.getElementById('pComp').value = profile.company || "";
                document.getElementById('pPhone').value = profile.phone || "";
            }
        }
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const updates = { id: currentUser.id, department: document.getElementById('pDept').value, grad_year: document.getElementById('pYear').value, company: document.getElementById('pComp').value, phone: document.getElementById('pPhone').value, updated_at: new Date() };
            const { error } = await supabase.from('profiles').upsert(updates);
            alert(error ? "Hata" : "Profil Güncellendi! ✅");
        });

        async function saveNote() {
            const content = document.getElementById('noteInput').value;
            if(!content) return;
            await supabase.from('personal_notes').insert({ user_id: currentUser.id, content: content });
            document.getElementById('noteInput').value = ""; loadNotes();
        }
        async function loadNotes() {
            const { data } = await supabase.from('personal_notes').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('notesList').innerHTML = data.map(n => 
                `<div class="note-card">${n.content}<i class="fa-solid fa-trash delete-note" onclick="deleteNote(${n.id})"></i></div>`
            ).join('');
        }
        async function deleteNote(id) { if(confirm("Sil?")) { await supabase.from('personal_notes').delete().eq('id', id); loadNotes(); }}

        // --- MESAJLAŞMA & DUYURULAR ---
        async function loadInbox() {
            const inboxList = document.getElementById('inboxList');
            inboxList.innerHTML = "";

            // 1. DUYURULARI ÇEK VE EKLE
            const { data: broadcastData } = await supabase.from('broadcasts').select('*').order('created_at', {ascending: false}).limit(1);
            let lastBroadcastMsg = "Henüz duyuru yok.";
            let lastBroadcastDate = "";
            if (broadcastData && broadcastData.length > 0) {
                lastBroadcastMsg = broadcastData[0].message;
                lastBroadcastDate = new Date(broadcastData[0].created_at).toLocaleDateString();
            }
            inboxList.innerHTML += `
            <div class="msg-item" onclick="openChat('broadcast', '📢 Topluluk Duyuruları')" style="background-color:#fef9e7; border-left: 4px solid #f1c40f;">
                <div style="font-weight:bold; display:flex; justify-content:space-between; color:#d35400;">
                    📢 Topluluk Duyuruları <span style="font-weight:normal; font-size:0.7rem; color:#999;">${lastBroadcastDate}</span>
                </div>
                <div style="font-size:0.8rem; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${lastBroadcastMsg}</div>
            </div>`;

            // 2. GELEN VE GİDEN MESAJLARI (OR MANTIĞI) İLE ÇEK
            const { data } = await supabase.from('direct_messages')
                .select('sender_id, receiver_id, sender_name, content, created_at, is_read')
                .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
                .order('created_at', {ascending: false});

            const uniqueContacts = new Set();
            
            if(data) {
                data.forEach(msg => {
                    // Karşı tarafın ID'sini bul
                    const partnerId = (msg.sender_id === currentUser.id) ? msg.receiver_id : msg.sender_id;
                    const isMeSender = (msg.sender_id === currentUser.id);
                    
                    if(!uniqueContacts.has(partnerId)) {
                        uniqueContacts.add(partnerId);
                        
                        // Okunmadı durumu sadece bana gelen mesajlarda geçerli
                        const isUnread = (!msg.is_read && msg.receiver_id === currentUser.id) ? 'unread' : '';
                        
                        // İsim Gösterimi
                        let displayName = msg.sender_name; 
                        if(isMeSender) displayName = "📤 Giden Mesaj"; // Basit çözüm (Daha ileri seviyede profilden çekilir)

                        inboxList.innerHTML += `
                        <div class="msg-item ${isUnread}" onclick="openChat('${partnerId}', '${isMeSender ? 'Sohbet' : displayName}')">
                            <div style="font-weight:bold;">${displayName}</div>
                            <small>${msg.content.substring(0,30)}...</small>
                        </div>`;
                    }
                });
            }
        }

        async function openChat(partnerId, partnerName) {
            activeChatUserId = partnerId;
            const chatBox = document.getElementById('chatBox');
            const sendArea = document.getElementById('sendArea');
            chatBox.innerHTML = `<div style="text-align:center; padding:10px; border-bottom:1px solid #eee;"><b>${partnerName}</b></div>`;

            if (partnerId === 'broadcast') {
                sendArea.style.display = 'none';
                const { data } = await supabase.from('broadcasts').select('*').order('created_at', {ascending: true});
                if (data) data.forEach(msg => {
                    const date = new Date(msg.created_at).toLocaleDateString();
                    chatBox.innerHTML += `<div class="chat-bubble theirs" style="background:#fff3cd; color:#856404; width:100%;"><div style="font-size:0.7rem; font-weight:bold; margin-bottom:5px;">YÖNETİM - ${date}</div>${msg.message}</div>`;
                });
            } else {
                sendArea.style.display = 'flex';
                const { data } = await supabase.from('direct_messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`).order('created_at', {ascending: true});
                data.forEach(msg => chatBox.innerHTML += `<div class="chat-bubble ${msg.sender_id === currentUser.id ? 'mine' : 'theirs'}">${msg.content}</div>`);
                
                // Sadece bana gelenleri okundu yap
                await supabase.from('direct_messages').update({is_read: true}).eq('sender_id', partnerId).eq('receiver_id', currentUser.id);
                checkNotifications();
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            if(!input.value || !activeChatUserId || activeChatUserId === 'broadcast') return;
            const myName = currentUser.user_metadata.full_name || "Üye";
            
            await supabase.from('direct_messages').insert({ sender_id: currentUser.id, receiver_id: activeChatUserId, content: input.value, sender_name: myName });
            
            document.getElementById('chatBox').innerHTML += `<div class="chat-bubble mine">${input.value}</div>`;
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            input.value = "";
            loadInbox(); // Giden mesaj listeye düşsün
        }

        // --- ÇOKLU GÖNDERİM ---
        async function openUserModal() {
            document.getElementById('userModal').style.display = 'flex';
            const { data } = await supabase.from('profiles').select('id, full_name').neq('id', currentUser.id).limit(100);
            const list = document.getElementById('userList');
            list.innerHTML = "";
            selectedUsers.clear();
            updateMultiSendButton();
            data.forEach(u => {
                list.innerHTML += `
                <div class="user-row">
                    <input type="checkbox" class="user-checkbox" value="${u.id}" onchange="toggleUser('${u.id}', '${u.full_name}', this)">
                    <span onclick="startNewChat('${u.id}', '${u.full_name}')" style="flex:1;">${u.full_name}</span>
                    <i class="fa-solid fa-comment" style="color:#ddd;" onclick="startNewChat('${u.id}', '${u.full_name}')"></i>
                </div>`;
            });
        }
        function toggleUser(id, name, checkbox) {
            if (checkbox.checked) selectedUsers.add(id); else selectedUsers.delete(id);
            updateMultiSendButton();
        }
        function updateMultiSendButton() {
            const btn = document.getElementById('btnMultiSend');
            const input = document.getElementById('multiMsgInput');
            btn.innerText = `Seçilenlere Gönder (${selectedUsers.size})`;
            if (selectedUsers.size > 0) { btn.disabled = false; input.style.display = 'block'; } else { btn.disabled = true; input.style.display = 'none'; }
        }
        async function sendMultiMessage() {
            const text = document.getElementById('multiMsgInput').value;
            if(!text || selectedUsers.size === 0) return;
            const myName = currentUser.user_metadata.full_name || "Üye";
            document.getElementById('btnMultiSend').innerText = "Gönderiliyor...";
            for (const receiverId of selectedUsers) {
                await supabase.from('direct_messages').insert({ sender_id: currentUser.id, receiver_id: receiverId, content: text, sender_name: myName });
            }
            alert("Mesajlar iletildi! 🚀");
            document.getElementById('userModal').style.display = 'none'; document.getElementById('multiMsgInput').value = ""; selectedUsers.clear(); loadInbox();
        }
        function startNewChat(id, name) { document.getElementById('userModal').style.display = 'none'; openChat(id, name); }

        // --- REALTIME & BİLDİRİM ---
        function setupRealtime() {
            supabase.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
                showNotification("YÖNETİM DUYURUSU", payload.new.message, "admin");
                loadInbox(); 
            }).subscribe();

            supabase.channel('chat-room').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: `receiver_id=eq.${currentUser.id}` }, payload => {
                if (activeChatUserId && payload.new.sender_id === activeChatUserId) {
                    const chatBox = document.getElementById('chatBox');
                    chatBox.innerHTML += `<div class="chat-bubble theirs">${payload.new.content}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    supabase.from('direct_messages').update({is_read: true}).eq('id', payload.new.id).then();
                } else {
                    showNotification(`💬 ${payload.new.sender_name}`, payload.new.content, "user");
                }
                loadInbox(); checkNotifications();
            }).subscribe();
        }

        function showNotification(title, msg, type) {
            const toast = document.getElementById('liveToast');
            document.getElementById('toastTitle').innerHTML = type==='admin' ? `<i class="fa-solid fa-tower-broadcast" style="color:#8e44ad"></i> ${title}` : `${title}`;
            document.getElementById('toastMessage').innerText = msg;
            toast.style.borderLeftColor = type==='admin' ? "#8e44ad" : "#3498db";
            toast.style.display = 'block';
            new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{});
            setTimeout(() => { toast.style.display = 'none'; }, 6000);
        }

        async function checkNotifications() {
            const { count } = await supabase.from('direct_messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser.id).eq('is_read', false);
            
            // Hem Menüdeki (navBadge) hem Sekmedeki (tabBadge) bildirimleri güncelle
            const navBadge = document.getElementById('navBadge');
            const tabBadge = document.getElementById('tabBadge');
            
            if(count > 0) { 
                if(navBadge) { navBadge.style.display = 'inline-block'; navBadge.innerText = count; }
                if(tabBadge) { tabBadge.style.display = 'inline-block'; tabBadge.innerText = count; }
            } else { 
                if(navBadge) navBadge.style.display = 'none'; 
                if(tabBadge) tabBadge.style.display = 'none';
            }
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>
</body>
</html>
