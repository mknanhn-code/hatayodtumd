<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilim - Hatay ODTÜ MD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root { --odtu-red: #E31E24; --odtu-dark: #2c3e50; --bg-light: #f8f9fa; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); padding-bottom: 50px; }

    /* NAVBAR */
    .navbar { width: 100%; height: 70px; background-color: var(--odtu-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-logo { height: 50px; background: white; padding: 2px; border-radius: 5px; }
    .nav-title { color: white; font-size: 1.1rem; font-weight: bold; }
    .nav-links a { color: #bdc3c7; text-decoration: none; margin-left: 20px; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: white; }
    .logout-btn { color: #e74c3c !important; }

    /* KART TASARIMI */
    .main-container { max-width: 800px; margin: 100px auto 0; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
    .header h2 { color: var(--odtu-dark); margin-bottom: 5px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    .btn-save { background: var(--odtu-dark); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
    .btn-save:hover { background: #1f2937; }

    /* HARİTA KUTUSU */
    #locationMap { width: 100%; height: 300px; border-radius: 8px; border: 2px solid #eee; margin-top: 10px; cursor: crosshair; }
    .location-info { font-size: 0.9rem; color: #666; margin-top: 5px; }
</style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left"><img src="logo.png" class="nav-logo"><div class="nav-title">Hatay ODTÜ MD</div></div>
        <div class="nav-links">
            <a href="dashboard.html">Panel</a>
            <a href="meeting.html">Meeting Hub</a>
            <a href="mentor.html">Mentorluk</a>
            <a href="career.html">Kariyer Lab</a>
            <a href="network.html">Mezun Ağı</a>
            <a href="profile.html" class="active">Profil</a>
            <a href="#" class="logout-btn" onclick="logout()">Çıkış</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="header">
            <h2>Profil Düzenle</h2>
            <p style="color:#777;">Bilgilerinizi güncel tutarak ağa katkıda bulunun.</p>
        </div>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <form id="profileForm">
            <div class="form-group">
                <label>Ad Soyad</label>
                <input type="text" id="fullName" class="form-control" readonly style="background:#f9f9f9;">
            </div>
            <div class="form-group">
                <label>Bölüm</label>
                <input type="text" id="dept" class="form-control">
            </div>
            
            <div id="gradFields" style="display:none;">
                <div class="form-group"><label>Şirket</label><input type="text" id="company" class="form-control"></div>
                <div class="form-group"><label>Sektör</label><input type="text" id="sector" class="form-control"></div>
                <div class="form-group"><label>Mezuniyet Yılı</label><input type="number" id="gradYear" class="form-control"></div>
            </div>

            <div id="studentFields" style="display:none;">
                <div class="form-group">
                    <label>Sınıf Seviyesi</label>
                    <select id="classLevel" class="form-control">
                        <option value="0">Hazırlık</option>
                        <option value="1">1. Sınıf</option>
                        <option value="2">2. Sınıf</option>
                        <option value="3">3. Sınıf</option>
                        <option value="4">4. Sınıf</option>
                        <option value="5">Yüksek Lisans</option>
                        <option value="6">Doktora</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-location-dot" style="color:var(--odtu-red);"></i> Konumunuzu İşaretleyin</label>
                <p class="location-info">Global haritada görünmek için yaşadığınız şehri seçin.</p>
                <div id="locationMap"></div>
                <input type="hidden" id="lat">
                <input type="hidden" id="lng">
            </div>

            <button type="submit" class="btn-save">Değişiklikleri Kaydet</button>
        </form>
    </div>

    <div id="liveToast" style="position:fixed; top:20px; right:20px; background:white; padding:15px; border-radius:8px; border-left:5px solid #27ae60; box-shadow:0 5px 15px rgba(0,0,0,0.2); display:none;">✅ Kaydedildi!</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hftrmiiacxgtkarsvupn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdHJtaWlhY3hndGthcnN2dXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODUzNzIsImV4cCI6MjA4MDM2MTM3Mn0.BgCk5xuZx6AZuxzfBHcQqg8j8BtxU9FbupDgoFecG_k';
        let supabase; try { supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch(e){}
        let map, marker;

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            initMap();
            loadProfile(session.user.id);
        });

        // HARİTA BAŞLATMA
        function initMap() {
            map = L.map('locationMap').setView([39.9334, 32.8597], 5); // Türkiye merkezli
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Haritaya tıklayınca
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                
                if (marker) map.removeLayer(marker);
                marker = L.marker([lat, lng]).addTo(map);
                
                document.getElementById('lat').value = lat;
                document.getElementById('lng').value = lng;
            });
        }

        // PROFİL YÜKLEME
        async function loadProfile(uid) {
            const { data } = await supabase.from('profiles').select('*').eq('id', uid).single();
            if(data) {
                document.getElementById('fullName').value = data.full_name;
                document.getElementById('dept').value = data.department;
                
                if(data.user_type === 'grad' || data.role === 'admin') {
                    document.getElementById('gradFields').style.display='block';
                    document.getElementById('company').value = data.company || '';
                    document.getElementById('sector').value = data.sector || '';
                    document.getElementById('gradYear').value = data.grad_year || '';
                } else {
                    document.getElementById('studentFields').style.display='block';
                    document.getElementById('classLevel').value = data.class_level || 1;
                }

                // Varsa Kayıtlı Konumu Göster
                if(data.latitude && data.longitude) {
                    marker = L.marker([data.latitude, data.longitude]).addTo(map);
                    map.setView([data.latitude, data.longitude], 10);
                    document.getElementById('lat').value = data.latitude;
                    document.getElementById('lng').value = data.longitude;
                }
            }
        }

        // KAYDETME
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.innerText = "Kaydediliyor..."; btn.disabled=true;

            const updates = {
                department: document.getElementById('dept').value,
                latitude: document.getElementById('lat').value || null,
                longitude: document.getElementById('lng').value || null
            };

            // Görünür olan alanları ekle
            if(document.getElementById('gradFields').style.display !== 'none') {
                updates.company = document.getElementById('company').value;
                updates.sector = document.getElementById('sector').value;
                updates.grad_year = document.getElementById('gradYear').value;
            } else {
                updates.class_level = document.getElementById('classLevel').value;
            }

            const { error } = await supabase.from('profiles').update(updates).eq('id', (await supabase.auth.getUser()).data.user.id);
            
            if(error) alert("Hata: " + error.message);
            else {
                document.getElementById('liveToast').style.display='block';
                setTimeout(()=>document.getElementById('liveToast').style.display='none', 3000);
            }
            btn.innerText = "Değişiklikleri Kaydet"; btn.disabled=false;
        });

        async function logout() { await supabase.auth.signOut(); window.location.href = "index.html"; }
    </script>
</body>
</html>
